name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Test the extension
      run: |
        set -eux
        jlpm run test

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .[test]

        pytest -vv -r ap --cov jupyterlab_live_content
        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyterlab_live_content.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "@jupyter-ai-contrib/live-content.*OK"
        python -m jupyterlab.browser_check

    - name: Check that all endpoints are authenticated
      run: |
        set -eux
        python .github/scripts/check_auth.py

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "jupyterlab_live_content" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: extension-artifacts
        path: dist/jupyterlab_live_content*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'x64'
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" jupyterlab_live_content*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyterlab_live_content.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "@jupyter-ai-contrib/live-content.*OK"
        python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: E2E tests / ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            slug: default
            rtc_package: ''
            rtc_env: ''
          - name: Verify disabled in RTC (+JCollab)
            slug: jcollab
            rtc_package: jupyter-collaboration
            rtc_env: '1'
          - name: Verify disabled in RTC (+JSD)
            slug: jsd
            rtc_package: jupyter-server-documents
            rtc_env: '1'

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v4
      with:
        name: extension-artifacts

    - name: Install the extension (and any RTC provider under test)
      run: |
        set -eux
        python -m pip install "jupyterlab>=4.0.0,<5" jupyterlab_live_content*.whl ${{ matrix.rtc_package }}

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Set up browser cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/pw-browsers
        key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

    - name: Install browser
      run: |
        set -eux
        jlpm playwright install chromium --only-shell
      working-directory: ui-tests

    - name: Execute integration tests
      working-directory: ui-tests
      # LIVE_CONTENT_RTC selects the suite: ./rtc (verify-disabled) when an RTC
      # provider is installed, ./tests (the default suite) otherwise.
      env:
        LIVE_CONTENT_RTC: ${{ matrix.rtc_env }}
      run: |
        jlpm playwright test

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jupyterlab_live_content-playwright-tests-${{ matrix.slug }}
        path: |
          ui-tests/test-results
          ui-tests/playwright-report

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
